[project]
name = "skry-kg"
version = "0.1.0"
description = "Skry — query-time entity neighborhood projection from a vector store"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
skry = "skry.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skry"]
